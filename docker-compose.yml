# Pokretanje celog sajta jednom komandom:  docker compose up --build
# Sajt: http://localhost:4000
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:4000
    volumes:
      - poruke:/app/data   # rezervne kopije poruka ostaju i posle restarta
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:3000
    ports:
      - "4000:4000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  poruke:
